{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">


  <title>Login </title>



  <!-- Bootstrap core CSS -->
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

  <!-- Custom styles for this template -->
  <link href="{% static 'css/signin.css' %}" rel="stylesheet">
</head>

<body class="text-center">
  <form class="form-signin" method="POST" action="{% url 'accounts:login' %}">

    {% csrf_token %}
    <img class="mb-4" src="https://getbootstrap.com/docs/4.0/assets/brand/bootstrap-solid.svg" alt="" width="72"
      height="72">
    <h1 class="h3 mb-3 font-weight-normal">Please Log in</h1>

    {% if messages %}
    {% for message in messages %}
    {% if message.tags == 'error' %}
    <center>
      <h4 style="color: red;">{{ message }}</h4>
    </center>

    {% endif %}
    {% endfor %}
    {% endif %}

    <label for="inputEmail" class="sr-only">Username</label>
    <input type="text" name="username" class="form-control" placeholder="Username or Email" required autofocus>

    <label for="inputPassword" class="sr-only">Password</label>
    <input type="password" name="password" class="form-control" placeholder="Password" required>

    <div class="checkbox mb-3">
      <label>
        <div>
          Not A memeber?
          <a href="{% url 'accounts:signup' %}" style="color:  rgba(34, 34, 95, 0.452);">signup</a>
        </div>
        <div>
          Forgot Your Password?
          <a href="{% url 'accounts:forgot-password' %}" style="color:  rgba(34, 34, 95, 0.452);">Reset Password</a>
        </div>
        <input type="checkbox" value="remember-me"> Remember me
      </label>
    </div>
    <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
    <p class="mt-5 mb-3 text-muted">&copy; 2017-2018</p>
  </form>
</body>

</html>
